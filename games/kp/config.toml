# Kinect Party recompiler configuration (XenonRecomp format). Paths are relative to this file.
# This file contains no game code or data; it only describes where things are.
#
# file_path is the default.xex of the Xbox Live Arcade package written out with x360tool
# stfs-extract (see docs/KINECTPARTY.md). It is encrypted with the retail key.

[main]
file_path = "../../extracted/kp/game/default.xex"
out_directory_path = "recomp4"
switch_table_file_path = "switch_tables.toml"

# Optimisations stay off until the game runs (XenonRecomp recommendation).
skip_lr = false
skip_msr = false
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
cr_as_local = false
non_argument_as_local = false
non_volatile_as_local = false

# Compiler-generated register save/restore helpers (tools/scripts/find_helpers.py on the extracted
# image: each pattern occurs exactly once).
restgprlr_14_address = 0x8248E800
savegprlr_14_address = 0x8248E7B0
restfpr_14_address = 0x82493B9C
savefpr_14_address = 0x82493B50
restvmx_14_address = 0x82498E58
savevmx_14_address = 0x82498BC0
restvmx_64_address = 0x82498EEC
savevmx_64_address = 0x82498C54

# The CRT's setjmp/longjmp (find_helpers.py candidates, checked by hand: the same code as Fruit Ninja
# Kinect's; setjmp saves the non-volatile registers at r3 and returns 0, longjmp restores them through
# r7 and returns r4, or 1). The game calls setjmp in 7 places and longjmp in 5 (Lua's error handling
# among them); as guest code longjmp can't return to where setjmp was called. The third candidate
# (823237C0) is a switch, not longjmp.
setjmp_address = 0x82495920
longjmp_address = 0x82495BF0

# Functions the analyser misses (address + size), added as they are found.
# functions = [
#   { address = 0x0, size = 0x0 },
# ]
