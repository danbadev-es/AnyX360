# Resident Evil 6 recompiler configuration (XenonRecomp format). Paths are relative to this file.
# This file contains no game code or data; it only describes where things are.
#
# The game is recompiled from its title update's executable (version 0.0.6.3, "RESIDENT EVIL 6 Title
# Update"): XenonRecomp applies patch_file_path to file_path and writes patched_file_path, which
# XenonAnalyse reads (x360tool xex-patch makes the same file).
# file_path is the base executable (version 0.0.0.3), the default.xex (BH6MasterRelease.exe) of the
# Games on Demand package written out with x360tool god-extract (see docs/RESIDENTEVIL6.md). It is
# encrypted with the retail key and uses basic (zero-fill) compression. patch_file_path is
# default.xexp from the update's package (TU_11K620P_000000C000000.00000000001G3, x360tool
# stfs-extract), see docs/RESIDENTEVIL6.md.

[main]
file_path = "../../extracted/re6/game/default.xex"
patch_file_path = "../../extracted/re6/update/default.xexp"
patched_file_path = "../../extracted/re6/update/default_0.0.6.3.xex"
out_directory_path = "recomp3"
switch_table_file_path = "switch_tables.toml"

# Optimisations stay off until the game runs (XenonRecomp recommendation).
skip_lr = false
skip_msr = false
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
cr_as_local = false
non_argument_as_local = false
non_volatile_as_local = false

# Compiler-generated register save/restore helpers (tools/scripts/find_helpers.py on the patched
# image: each pattern occurs exactly once).
restgprlr_14_address = 0x83AD03B0
savegprlr_14_address = 0x83AD0360
restfpr_14_address = 0x83AD141C
savefpr_14_address = 0x83AD13D0
restvmx_14_address = 0x83AD1708
savevmx_14_address = 0x83AD1470
restvmx_64_address = 0x83AD179C
savevmx_64_address = 0x83AD1504

# The CRT's setjmp/longjmp (find_helpers.py candidates, checked by hand on the base: word for word
# Black Ops II's, apart from the global setjmp reads and the call longjmp makes). In the patched
# image: the base's pair (83A65250/83A64F30) matched by instruction shape and checked over 24
# instructions; the other longjmp candidates (0x827C5440, 0x83893D50, 0x83969368) are ordinary
# functions.
setjmp_address = 0x83AD6930
longjmp_address = 0x83AD6610

# Functions the analyser gets wrong (address + size), added as they are found. Both are leaf
# functions without .pdata entries whose switch counts down CTR with bdzf; the last conditional
# branch targets the next instruction, which the analyser takes for an empty block, so it cut the
# function there (as in Black Ops II's sub_82539CB8) and the later cases' branches back to the shared
# return paths were lost. The base's addresses (83726460, 824DDB90) found in the patched image by
# instruction shape over the whole function (the only match).
functions = [
  # Maps a code to an HRESULT (compares r3 with 0x805000xx codes); ends at 0x83797D78 (blr).
  { address = 0x83797B20, size = 0x25C },
  # A check on a global state table (cases 0-4); ends at 0x825029EC (blr). The update added a
  # check of its own before it (five instructions from 0x82502938), so it starts there.
  { address = 0x82502938, size = 0xB8 },
]
