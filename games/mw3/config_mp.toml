# Call of Duty: Modern Warfare 3 multiplayer recompiler configuration (XenonRecomp format). Paths are
# relative to this file. This file contains no game code or data; it only describes where things are.
#
# file_path is the multiplayer default_mp.xex (iw5mp_ship.exe) of the Games on Demand package written
# out with x360tool god-extract (see docs/MODERNWARFARE3.md): a second program of the same title,
# which the single-player executable starts with XamLoaderLaunchTitle. Encrypted with the retail key,
# basic (zero-fill) compression, like default.xex.
#
# The executable is recompiled from the title update (version 0.0.23.8): XenonRecomp applies
# patch_file_path (default_mp.xexp from the update's package, tu00000008_00000000, x360tool
# stfs-extract; see docs/MODERNWARFARE3.md) to file_path (version 0.0.0.8) and writes patched_file_path, which
# XenonAnalyse reads (x360tool xex-patch makes the same file).

[main]
file_path = "../../extracted/mw3/game/default_mp.xex"
patch_file_path = "../../extracted/mw3/update/default_mp.xexp"
patched_file_path = "../../extracted/mw3/update/default_mp_0.0.23.8.xex"
out_directory_path = "recomp_mp2"
switch_table_file_path = "switch_tables_mp.toml"

# Optimisations stay off until the game runs (XenonRecomp recommendation).
skip_lr = false
skip_msr = false
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
cr_as_local = false
non_argument_as_local = false
non_volatile_as_local = false

# Compiler-generated register save/restore helpers (tools/scripts/find_helpers.py on the patched
# image: each pattern occurs exactly once).
restgprlr_14_address = 0x82558230
savegprlr_14_address = 0x825581E0
restfpr_14_address = 0x8255837C
savefpr_14_address = 0x82558330
restvmx_14_address = 0x82559A88
savevmx_14_address = 0x825597F0
restvmx_64_address = 0x82559B1C
savevmx_64_address = 0x82559884

# The CRT's setjmp/longjmp (find_helpers.py candidates, checked by hand: word for word the
# single-player executable's, apart from relocated addresses). Com_Error leaves the failed frame
# with longjmp, as in the campaign.
# In the patched image: the base's pair (82544510/825452B0) matched by instruction shape and checked
# over 24 instructions (find_helpers.py on the patched image finds the same setjmp).
setjmp_address = 0x8255A250
longjmp_address = 0x8255AFF0

# Functions the analyser misses (address + size), added as they are found.
# # The base's entry found in the patched image by its shape over the whole function (the same
# instructions; only its jump table's addresses moved).
functions = [
#   { address = 0x0, size = 0x0 },
# ]
