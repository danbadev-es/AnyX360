# Forza Motorsport 4's XMediaFacade_default.xex (a title DLL: the XDK's WMV video decoder behind the
# game's media facade), recompiled into the game's executable and loaded by XexLoadImage. Base
# 0x88000000, version 0.0.0.15, encrypted with the retail key. See docs/FORZAMOTORSPORT4.md.

[main]
file_path = "../../extracted/fm4/game/XMediaFacade_default.xex"
out_directory_path = "recomp_xmedia"
switch_table_file_path = "switch_tables_xmedia.toml"
# Its own names for the entry point, the helpers and the function mappings
# (xmedia_PPCFuncMappings), which link next to the game's (XenonRecomp anyx360-fm4).
symbol_prefix = "xmedia_"

skip_lr = false
skip_msr = false
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
cr_as_local = false
non_argument_as_local = false
non_volatile_as_local = false

# find_helpers.py on the DLL's image (--base 0x88000000). No setjmp/longjmp.
restgprlr_14_address = 0x88050840
savegprlr_14_address = 0x880507F0
restfpr_14_address = 0x881EF27C
savefpr_14_address = 0x881EF230
restvmx_14_address = 0x881EEF58
savevmx_14_address = 0x881EECC0
restvmx_64_address = 0x881EEFEC
savevmx_64_address = 0x881EED54
