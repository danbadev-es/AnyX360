# Kinect Sports recompiler configuration (XenonRecomp format). Paths are relative to this file.
# This file contains no game code or data; it only describes where things are.
#
# The game is recompiled from its title update's executable (version 0.0.4.2, "Kinect SportsTitle
# Update"): XenonRecomp applies patch_file_path to file_path and writes patched_file_path, which
# XenonAnalyse reads (x360tool xex-patch makes the same file).
# file_path is the base executable (version 0.0.0.2), the default.xex of the Games on Demand package
# written out with x360tool god-extract (see docs/KINECTSPORTS.md). It is encrypted with the retail
# key and LZX-compressed. patch_file_path is default.xexp from the update's package
# (TU_16L6269_0000008000000.0000000000102, x360tool stfs-extract), see docs/KINECTSPORTS.md.

[main]
file_path = "../../extracted/ks/game/default.xex"
patch_file_path = "../../extracted/ks/update/default.xexp"
patched_file_path = "../../extracted/ks/update/default_0.0.4.2.xex"
out_directory_path = "recomp4"
switch_table_file_path = "switch_tables.toml"

# Optimisations stay off until the game runs (XenonRecomp recommendation).
skip_lr = false
skip_msr = false
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
cr_as_local = false
non_argument_as_local = false
non_volatile_as_local = false

# Compiler-generated register save/restore helpers (tools/scripts/find_helpers.py on the patched
# image: each pattern occurs exactly once).
restgprlr_14_address = 0x82FBA8D0
savegprlr_14_address = 0x82FBA880
restfpr_14_address = 0x82FBBE3C
savefpr_14_address = 0x82FBBDF0
restvmx_14_address = 0x82FBF278
savevmx_14_address = 0x82FBEFE0
restvmx_64_address = 0x82FBF30C
savevmx_64_address = 0x82FBF074

# The CRT's setjmp/longjmp (find_helpers.py candidates, checked by hand: the same code as Fruit Ninja
# Kinect's and Doritos Crash Course's).
# In the patched image: the base's pair (82F6C150/82F6C420) matched by instruction shape
# and checked over 24 instructions.
setjmp_address = 0x82FBD980
longjmp_address = 0x82FBDC50

# Functions the analyser misses (address + size), added as they are found.
# functions = [
#   { address = 0x0, size = 0x0 },
# ]
