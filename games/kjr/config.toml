# Kinect Joy Ride recompiler configuration (XenonRecomp format). Paths are relative to this file.
# This file contains no game code or data; it only describes where things are.
#
# The game is recompiled from its title update's executable (version 0.0.3.1, "Kinect JoyRide Title
# Update #3"): XenonRecomp applies patch_file_path to file_path and writes patched_file_path, which
# XenonAnalyse reads (x360tool xex-patch makes the same file).
# file_path is the base executable (version 0.0.0.1), the default.xex of the Games on Demand package
# written out with x360tool god-extract (see docs/KINECTJOYRIDE.md). It is encrypted with the retail
# key and LZX-compressed. patch_file_path is default.xexp from the update's package
# (TU_16L629R_0000004000000.00000000000O1, x360tool stfs-extract), see docs/KINECTJOYRIDE.md.

[main]
file_path = "../../extracted/kjr/game/default.xex"
patch_file_path = "../../extracted/kjr/update/default.xexp"
patched_file_path = "../../extracted/kjr/update/default_0.0.3.1.xex"
out_directory_path = "recomp4"
switch_table_file_path = "switch_tables.toml"

# Optimisations stay off until the game runs (XenonRecomp recommendation).
skip_lr = false
skip_msr = false
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
cr_as_local = false
non_argument_as_local = false
non_volatile_as_local = false

# Compiler-generated register save/restore helpers (tools/scripts/find_helpers.py on the patched
# image: each pattern occurs exactly once).
restgprlr_14_address = 0x829FDE50
savegprlr_14_address = 0x829FDE00
restfpr_14_address = 0x829FFDDC
savefpr_14_address = 0x829FFD90
restvmx_14_address = 0x82A007E8
savevmx_14_address = 0x82A00550
restvmx_64_address = 0x82A0087C
savevmx_64_address = 0x82A005E4

# The CRT's setjmp/longjmp (find_helpers.py candidates, checked by hand: word for word Kinect Sports'
# 82F6C150/82F6C420). The other longjmp candidates are ordinary functions.
# In the patched image: the base's pair (829FD5A0/829FD870) matched by instruction shape
# and checked over 24 instructions.
setjmp_address = 0x82A03C30
longjmp_address = 0x82A03F00

# Functions the analyser misses (address + size), added as they are found.
# functions = [
#   { address = 0x0, size = 0x0 },
# ]
