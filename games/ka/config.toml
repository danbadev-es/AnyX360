# Kinect Adventures recompiler configuration (XenonRecomp format). Paths are relative to this file.
# This file contains no game code or data; it only describes where things are.
#
# file_path is the Default.xex of the disc files extracted from the Games on Demand package
# (x360tool god-extract, see docs/KINECTADVENTURES.md). It is encrypted with the retail key.

[main]
file_path = "../../extracted/ka/game/Default.xex"
out_directory_path = "recomp2"
switch_table_file_path = "switch_tables.toml"

# Optimisations stay off until the game runs (XenonRecomp recommendation).
skip_lr = false
skip_msr = false
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
cr_as_local = false
non_argument_as_local = false
non_volatile_as_local = false

# Compiler-generated register save/restore helpers (tools/scripts/find_helpers.py on the extracted
# image: each pattern occurs exactly once).
restgprlr_14_address = 0x83191CA0
savegprlr_14_address = 0x83191C50
restfpr_14_address = 0x831923FC
savefpr_14_address = 0x831923B0
restvmx_14_address = 0x83192808
savevmx_14_address = 0x83192570
restvmx_64_address = 0x8319289C
savevmx_64_address = 0x83192604

# setjmp/longjmp: no candidates.
# setjmp_address = 0x0
# longjmp_address = 0x0

# Functions the analyser misses (address + size), added as they are found.
# functions = [
#   { address = 0x0, size = 0x0 },
# ]
