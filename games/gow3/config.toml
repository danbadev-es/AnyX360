# Gears of War 3 recompiler configuration (XenonRecomp format).
# Addresses are filled in during Phase 1/2 from Ghidra analysis. Paths are relative to this file.
# This file contains no game code or data; it only describes where things are.

[main]
file_path = "../../extracted/gow3/Gears Of War 3/AP7kB/default.xex"
# patch_file_path = "../../extracted/gow3/default.xexp"   # Title Update, if we target one
out_directory_path = "recomp2"
switch_table_file_path = "switch_tables.toml"

# Optimisations stay off until the game runs (XenonRecomp recommendation).
skip_lr = false
skip_msr = false
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
cr_as_local = false
non_argument_as_local = false
non_volatile_as_local = false

# Compiler-generated register save/restore helpers. Each byte pattern from the XenonRecomp README
# occurs exactly once in .text (tools/scripts/find_helpers.py on the extracted image).
restgprlr_14_address = 0x82CC9910
savegprlr_14_address = 0x82CC98C0
restfpr_14_address = 0x82CCA1CC
savefpr_14_address = 0x82CCA180
restvmx_14_address = 0x82CCA518
savevmx_14_address = 0x82CCA280
restvmx_64_address = 0x82CCA5AC
savevmx_64_address = 0x82CCA314

# CRT setjmp/longjmp: no setjmp-shaped function found; probably unused (UE3 does not use them).
# Candidate to check in Ghidra: 0x82CCC3F0 (calls RtlUnwind, saves non-volatile registers).
# setjmp_address = 0x0
# longjmp_address = 0x0

# Functions the analyser misses (address + size), added as they are found.
# functions = [
#   { address = 0x0, size = 0x0 },
# ]

# Hooks into recompiled code, e.g. to replace UE3's Xenon RHI entry points.
# [[midasm_hook]]
# name = "GoW3_RHI_Present"
# address = 0x0
# registers = ["r3"]
